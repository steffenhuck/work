<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steffen Huck — WZB &amp; UCL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;500&display=swap" rel="stylesheet">
  <meta name="description" content="Steffen Huck — Research Professor of Behavioral Economics and Human Agency at WZB; Emeritus Professor of Economics at UCL." />
  <style>
    :root{
      --bg: #FCFCFB;
      --ink: #1f2428;
      --col-max: 640px;
      --gutter: clamp(20px, 5vw, 64px);
    }
    *{ box-sizing: border-box; }
    html, body{ height: 100%; }
    body{
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Work Sans", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .wrap{
      width: min(var(--col-max), calc(100% - (2 * var(--gutter))));
      margin: 0 auto;
      padding: clamp(56px, 10vh, 96px) 0 72px;
    }
    .home{
      display: inline-block;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.07em;
      text-decoration: none;
      color: var(--ink);
    }
    .home:hover{
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .idblock{
      margin: 8px 0 0;
      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.65;
    }
    .links{
      margin-top: 42px;
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.7;
    }
    .links a{
      color: var(--ink);
      text-decoration: none;
    }
    .links a:hover{
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .pair{
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
    }
    .sep{
      padding: 0 18px;
      font-weight: 500;
    }
    .section-gap{
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="masthead">
      <a class="home" href="../" aria-label="Back to homepage">steffen huck</a>
      <p class="idblock">
        research professor, behavioral economics and human agency, wzb<br>
        emeritus professor of economics, ucl
      </p>
    </header>
    <nav class="links" aria-label="External links">
      <a href="https://www.wzb.eu/en/persons/steffen-huck">wzb profile</a>
      <div class="pair">
        <a href="https://scholar.google.com/citations?hl=en&user=FvBiCdwAAAAJ">google scholar</a>
        <span class="sep" aria-hidden="true">|</span>
        <a href="https://www.linkedin.com/in/steffen-huck">linkedin</a>
      </div>
      <div class="pair section-gap">
        <a href="https://steffenhuck.github.io/drafts/">current drafts</a>
      </div>
      <div class="pair">
        <a href="https://steffenhuck.github.io/fundraising/">fundraising</a>
      </div>
    </nav>
  </main>
  <script data-goatcounter="https://steffenhuck.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
